<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <title>Cart local preview</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 640px; margin: 0 auto; }
    .product { border: 1px solid #ddd; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .cart_product_wr { border-bottom: 1px solid #eee; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .cart_quantity_counter_wr { display: inline-flex; gap: 8px; align-items: center; }
    .minus_btn_wr, .plus_btn_wr { width: 20px; cursor: pointer; border: 1px solid #ccc; text-align: center; }
    .checkout_button { margin-top: 16px; padding: 8px 16px; }
  </style>
  <!-- Meta Pixel: на сайті сніпет стоїть у Webflow → Custom code → Head. Тут вимкнено,
       щоб перевіряти сценарій «fbq відсутній». Для перевірки подій — розкоментувати
       й підставити PIXEL_ID.
  <script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', 'PIXEL_ID');
  fbq('track', 'PageView');
  </script>
  -->
</head>
<body>
  <h1>Каталог (тестові товари)</h1>

  <div class="product" data-name="Vase A" data-price="120" data-product-code="vase-a" data-img-src="" data-product-page="#" data-author="Studio X">
    <span>Vase A — €120</span>
    <a href="#" class="js-add-to-cart">Add to cart</a>
  </div>

  <div class="product" data-name="Vase B" data-price="85" data-product-code="vase-b" data-img-src="" data-product-page="#" data-author="Studio Y">
    <span>Vase B — €85</span>
    <a href="#" class="js-add-to-cart">Add to cart</a>
  </div>

  <h1>Кошик</h1>
  <p>
    Товарів у кошику:
    <span data-cart-button="quantity-el" style="display:none;">
      <span data-cart-button="quantity-number">0</span>
    </span>
  </p>

  <div id="cart-product-list"></div>
  <div id="cart-bottom" style="display:none;">
    <p>Разом: €<span id="cart-subtotal-num">0</span></p>
    <button class="checkout_button">Checkout</button>
  </div>

  <!-- Заглушка Webflow-рушія: на реальному сайті Webflow сам виконує чергу
       window.Webflow.push(fn); тут її немає, тож виконуємо fn() одразу -->
  <script>
    window.Webflow = { push: (fn) => fn() };
  </script>

  <!-- Локально Parcel watch пише в ../dist/cart.js -->
  <script src="../dist/cart.js"></script>
</body>
</html>
